# SPDX-License-Identifier: MIT
#
# User-config override. The board defconfig ships
# CONFIG_ZMK_IDLE_TIMEOUT=3600000 -- an hour -- because the author runs this
# keyboard wired. Both halves also set CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y,
# so at that timeout the backlight stays lit for an hour after the last
# keystroke, on both halves. On battery that is the dominant drain.
#
# 60 seconds instead. This is the idle state only: the board still never
# deep-sleeps, because no wake source is wired up (the PCA9555 INT lines are
# unused, so a sleeping MCU cannot see a keypress). See docs/limitations.md.
CONFIG_ZMK_IDLE_TIMEOUT=60000

# ---------------------------------------------------------------------------
# BLE stability. The host link was pairing and then cycling connected /
# disconnected on Windows, on battery and on mains, with the stale factory
# pairing removed and USB unplugged. Three changes, all aimed at the same
# root cause: this board has no confirmed 32.768 kHz crystal, so it runs the
# internal RC oscillator at 500 ppm -- the worst accuracy bucket BLE defines,
# against the 20-50 ppm a crystal would give.

# Listen on every connection event instead of skipping up to 30 of them.
# ZMK's default latency of 30 lets the link sleep ~465 ms between anchor
# points; at 500 ppm the clock drifts far enough across that gap to miss the
# window, and enough consecutive misses reach the 4 s supervision timeout and
# drop the link. Costs power, buys margin. Raise it again once stable.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Recalibrate the RC oscillator every 2 s unconditionally, rather than every
# 4 s and only when the temperature moved 0.5 degrees. Directly reduces the
# drift the setting above is compensating for.
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=2000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=0

# +8 dBm instead of the radio default of 0. More link margin for both the host
# link and the split link. This is what upstream's open numpad PR does on all
# three parts. Costs battery and is an emissions change.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---------------------------------------------------------------------------
# Re-pairing. A host could not pair again after being removed: the keyboard
# still held its keys in a bond no profile pointed to, which BT_CLR cannot
# reach (clear_profile_bond() only unpairs an address a profile records), and
# Zephyr refuses a fresh unauthenticated pairing from a peer it holds keys for.
# Allow the overwrite. Pairing is still only accepted on an open profile.
#
# This is half of ZMK's CONFIG_ZMK_BLE_EXPERIMENTAL_SEC. The other half,
# passkey entry, is left off so pairing works as it did: the option implies it,
# so say no explicitly.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# ---------------------------------------------------------------------------
# Deep sleep. Needs the kscan wake-source commit on the board-port fork
# (formerly patches/0002), which arms the PCA9555 INT line as a System OFF
# wake source -- without it the keyboard would sleep and never wake.
#
# Ten minutes rather than ZMK's default of fifteen, and rather than the 60 s
# the wake path was tested at. Waking is a reboot, not a resume: the chip comes
# up from scratch, Bluetooth re-establishes over a few seconds, and the
# keypress that woke it is consumed as the trigger rather than typed. At 60 s
# that lands every time you pause to read something. At ten minutes it lands
# when you leave the desk, which is the point.
#
# Only ever applies on battery. ZMK's activity.c gates on
# !is_usb_power_present(), so a cabled keyboard never sleeps.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
