# SPDX-License-Identifier: MIT

# Pinned build inputs. Everything here is public: this manifest and this
# repository are enough to reproduce every firmware image from a clean
# checkout.
#
# NocFree-and-zmk is the board port (board definition, kscan driver). This
# pins our fork of Thie1e/NocFree-and-zmk: branch kscan-int-sleep, which is
# upstream iso-de at 08bc83bf plus two kscan commits -- interrupt-driven idle
# on the PCA9555 INT line, and INT as the System OFF wake source. Rebase that
# branch to move to a newer upstream, then update the revision here.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: nocfree
      url-base: https://github.com/mathiasi
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: 6e2ef41e022d555b10f116e395832913f71717b3
      import: app/west.yml
    - name: NocFree-and-zmk
      remote: nocfree
      revision: 2e5d9d0040e11b76752d87195c3c16cd2cc549d7 # branch kscan-int-sleep
      path: nocfree-and-zmk
  self:
    path: config
