name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  # build.sh can apply patches/ to the board port for a local experiment; the
  # reusable workflow below cannot. A CI image silently missing a patch is
  # worse than no image -- without the wake-source change, for one, a keyboard
  # with CONFIG_ZMK_SLEEP on sleeps and never wakes on a keypress -- so refuse
  # while patches/ holds any. Changes to the board port belong on the fork
  # config/west.yml points at.
  no-local-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ls patches/*.patch >/dev/null 2>&1; then
            echo "::error::patches/ is not empty. Commit them to the NocFree-and-zmk fork, move the revision in config/west.yml, and delete them here."
            exit 1
          fi

  build:
    needs: no-local-patches
    # Same commit as zmk in config/west.yml.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@6e2ef41e022d555b10f116e395832913f71717b3
